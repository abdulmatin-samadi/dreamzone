# Production-like stack: PostgreSQL + Redis + Django (gunicorn) + Celery worker/beat.
# Run the React app with `npm run dev` (or serve frontend/dist with any static server / nginx).
services:
  db:
    image: postgres:16
    environment: { POSTGRES_DB: dreamzone, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
  api: &api
    build: ./backend
    environment: &env
      DJANGO_SECRET_KEY: change-me-in-production-please-use-a-long-random-value
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      DB_ENGINE: postgres
      DB_NAME: dreamzone
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on: [db, redis]
    ports: ["8000:8000"]
    volumes: [media:/app/media]
  worker:
    <<: *api
    command: celery -A config worker -l info
    ports: []
  beat:
    <<: *api
    command: celery -A config beat -l info
    ports: []
volumes: { pgdata: {}, media: {} }
